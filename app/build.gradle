plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sparkle.pawidget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sparkle.pawidget'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal sideload build: sign release with the debug key so it installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Java artifact (palette-ktx only adds Kotlin extensions; this project is Java).
    implementation 'androidx.palette:palette:1.0.0'
}
